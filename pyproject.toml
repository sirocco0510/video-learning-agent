[project]
name = "video-learning-agent"
version = "0.1.0"
description = "本地视频挂机学习 Agent（B站字幕 + faster-whisper + LLM 总结）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "pyobjc-framework-quartz>=12.2.2",
    "pysrt>=1.1.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "webvtt-py>=0.5.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
vla = "vla.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
