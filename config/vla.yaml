# video-learning-agent 默认配置(SSOT: requirements.md 第八章)
# 修改需求 → 先改 requirements.md,再同步本文件

storage:
  tmp_dir: "./tmp"
  auto_cleanup_on_pass: true

whisper:
  model: "small"          # tiny | base | small | medium | large-v3
  language: "zh"
  segment_seconds: 30
  compute_type: "int8"    # int8 / int8_float16 / float16
  # 2026-09-02 Level 3 步骤 1:本地后处理(碎片合并 + 重复段去重)
  postprocess_enabled: true
  postprocess_min_line_chars: 8      # 短于这个字符的行认为碎片
  postprocess_max_line_chars: 80     # 合并后单行上限
  postprocess_min_overlap_chars: 6   # 重复段最小公共子串

video_source:
  prefer_download: true
  download:
    # 2026-09-02 修正:"worst" 在 B站 audio-only 格式上不可用,改为"最低画质视频 + 最佳音频"优先
    # 备选降级:仅最低画质 / 仅最佳。详见 yt-dlp format selector。
    format: "bestvideo[height<=360]+bestaudio/best[height<=360]/best"

quality_check:
  enabled: true
  # 2026-09-10 Phase 9.6.4 bill-jc spike 放宽:公司内部培训课程(命令行参数 /
  # Java 基础)语速 0.5-1 cps + 大量 Whisper 术语错误("花扩号"→"花括号"等),
  # LLM 给 55-68 分(因术语错误扣分),原阈值 70/1.0 全 fail。
  # 用户决策:语速 0.5 字/秒以上 + LLM ≥ 50 即可过(关注内容完整性,不卡术语准度)。
  # 后续若需要更严,可在 requirements.md FR-4 加版本号注释。
  min_score_to_pass: 50
  min_char_per_second: 0.5
  max_char_per_second: 20.0  # 2026-09-07 v3.2.1 由 15 → 20(tiny 模型中文峰值 19-25 cps)
  # 2026-09-02 Level 4:LLM 语义清理(faster-whisper 输出整理)
  # refine_enabled=true 才调 LLM
  # refine_max_chars=6000 是粗估的输入 token 上限(超出跳过 LLM,只用本地清理)
  # refine_max_output_tokens=4000 是 LLM 输出上限。
  # 2026-09-10 切 deepseek-flash 后:推理走独立 reasoning_content 字段(不内联 <think>),
  # 但 reasoning_tokens 计入 completion_tokens → 4000 须同时覆盖 推理 + 正文。
  refine_enabled: true
  refine_max_chars: 6000
  refine_max_output_tokens: 4000

summary:
  target_words_min: 500
  target_words_max: 800
  notes_file: "./notes/videos.md"
  cross_video_dedup: true
  # FR-9 配额触发
  trigger_mode: "quota"           # quota(累计 6h) | per_video(每条)
  notes_section_header: "## {group_title}"  # 笔记里用什么标题分段

quota:                              # FR-9 累计时长配额
  summary_threshold_sec: 21600    # 6 小时 = 21600 秒
  on_exhausted: "stop_session"     # 达到阈值后行为:stop_session | continue

history:                            # FR-9.5/9.6 去重历史
  file: "./logs/transcribed_history.jsonl"
  # 每行 JSON:
  # {"url": "bilibili://group/python-tutorial-basics/BV1xxx",
  #  "title": "...", "duration_sec": 1800, "transcribed_at": "2026-08-31T10:00:00"}

logging:
  log_dir: "./logs"
  notify_on_fail: false                 # FR-6.4:转写/质量失败不通知
  log_alert_threshold: 50               # FR-6.6:每 50 条失败弹窗汇总一次
  log_alert_enabled: true               # 是否启用失败日志上限弹窗

# F2-10 (2026-09-08):用户手动下载音频根目录
# 用户把 Tab Audio Recorder 录完的 webm 拖到 <downloads_dir>/YYYY-MM-DD/
audio:
  downloads_dir: "./tmp/audio_downloads"
  # 2026-09-10 FR-2.30.1:路径 ② 抽音上限(秒)。1800 = 只留视频前 30 分钟,
  # 超出部分直接丢弃(用户裁定)。理由:30 分钟语音 ≈ 8700 字,再长会顶到
  # LLM 预算(refine_max_chars / max_tokens);顺带省磁盘与时间。
  # 设 null → 不截断。
  max_extract_sec: 1800

llm_client:
  provider: "deepseek"    # openai | qwen | deepseek | minimax
  api_key_env: "OPENAI_API_KEY"
  base_url_env: "OPENAI_BASE_URL"
  # 2026-09-10:关掉 reasoning model 的推理链。
  # deepseek-flash 默认推理极啰嗦 —— 实测一个 2507 字的 refiner 任务烧掉
  # 16232 reasoning tokens,而这些 token **计入 max_tokens**,把 refiner 的
  # 4000 预算吃光 → content 返回空 → Refiner 静默回退原文。
  # 本项目三个云端 LLM 用途(质量检查 / 字幕清理 / 批量总结)都是机械任务,
  # 不需要推理链。实测 "none" 让 reasoning_tokens 归零,refiner 12.4s 跑通,
  # 输出 2617 字(与开着推理的 deepseek-chat 的 2619 字基本一致)。
  # 可选值:"none"(关)| "minimal" | "low" | "high" | 删掉本行(走端点默认,需自行拉大 max_tokens)
  reasoning_effort: "none"

# R-10(2026-09-03):LLM 模型选择统一在这里 — 旧 quality_check.model / refine_model /
# summary.model 字段已删除,通过 VLAConfig._migrate_legacy_llm_keys 自动迁移。
# 2026-09-10:从 MiniMax-M2.7-highspeed 切到 deepseek-flash。
# 原因:MiniMax Token Plan 用量耗尽 —— spike 跑 Refiner 时 429
#   "已达到 Token Plan 用量上限:请升级 Token Plan 套餐或购买积分补充用量。 (2056)"
# 导致质量门控拿不到 LLM 分数。DeepSeek 端点同 key 另有 deepseek-v4-pro(更强,未启用)。
#
# deepseek-flash 实测行为(2026-09-10,与 MiniMax 不同,注意):
#   - 推理走**独立字段** `reasoning_content`,**不**内联 <think>...</think> 块
#     → LLMClient.complete 的 message.content 直接拿到干净正文;
#       QualityChecker / Refiner 的 _parse_json 剥壳逻辑仍兼容,不冲突。
#   - `reasoning_tokens` **计入** `completion_tokens`(实测 52 总 / 50 推理)
#     → max_tokens 必须同时覆盖 推理 + 正文,否则 content 返回空串,
#       而 LLMClient 的 `content or ""` 会把空串静默吞掉(不抛错)。
#       轻量任务实测推理只吃 ~134 tokens,4000 余量充足。
llm:
  refine_model: "deepseek-flash"
  quality_model: "deepseek-flash"
  summary_model: "deepseek-flash"

puppeteer:                                 # Phase 3.1+ Puppeteer CDP 配置
  debugging_port: 9222                    # Chrome --remote-debugging-port
  cdp_host: "localhost"
  # 注意:录屏相关字段(hotkey / download timeout)已挪到 browser_plugin: 下
  # (FR-2.16/2.17 属于 BrowserPluginConfig,而非 PuppeteerConfig)。

platforms:                                 # Phase 3 平台适配器注册(FR-2.0)
  bilibili:
    enabled: true
    match_hosts:
      - "bilibili.com"
      - "b23.tv"
  internal_site:
    enabled: true                         # 2026-09-10 bill-jc 实跑打开
    match_hosts:
      - "b-learning.bill-jc.com"
      - "b-learning.bill-jc.com"
